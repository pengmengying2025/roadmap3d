<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>layergraph engine</title>
<style>
  :root{--s:1;--font:serif;--em:inherit;--radius:12px}
  html,body{margin:0;overflow:hidden;background:#000}
  #c,#bg,#vig{position:absolute;left:0;top:0}
  #vig{pointer-events:none}
  #hud{position:absolute;left:0;top:0;width:1920px;height:1080px;zoom:var(--s);font-family:var(--font);letter-spacing:-0.01em;font-kerning:normal}
  #brand{position:absolute;left:56px;top:44px;font-weight:600;font-size:24px}
  #brand small{display:block;font-weight:400;font-size:13px;margin-top:6px;letter-spacing:0}
  #legend{position:absolute;right:56px;top:76px;font-size:12px;text-align:right;line-height:1.8}
  #legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin:0 7px 0 16px;vertical-align:0}
  #legend i.leaf{border-radius:2px;transform:rotate(45deg)}
  #legend i.minor{width:7px;height:7px;border:2px solid}
  #cap{position:absolute;left:50%;bottom:36px;transform:translateX(-50%);max-width:1100px;padding:12px 26px;border-radius:var(--radius);text-align:center;opacity:0}
  #cap .t{font-weight:600;font-size:22px;line-height:1.35}
  #cap .t em{font-style:normal;font-weight:600;color:var(--em)}
  #cap .s{font-size:15px;margin-top:5px;line-height:1.5;font-weight:400}
  #tail{position:absolute;left:56px;bottom:44px;max-width:600px;padding:10px 20px;border-radius:var(--radius);font-size:20px;font-weight:600;border:1px solid;opacity:0}
  .hide{display:none!important}
</style></head>
<body>
<div id="bg"></div><canvas id="c"></canvas><div id="vig"></div>

  const far = smooth(R0 * 0.45, R0 * 0.63, d); const axisFar = smooth(R0 * 0.61, R0 * 0.80, d); axisLabels.forEach(s => { fitPx(s, s.userData.px); s.material.opacity = axisFar * edgeFade(s); }); layerLabels.forEach(s => { fitPx(s, s.userData.px); s.material.opacity = edgeFade(s); }); minorLabels.forEach(s => fitPx(s, s.userData.px)); leafLabels.forEach(s => fitPx(s, s.userData.px));
